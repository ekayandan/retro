name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test-core.js
      - run: node tools/test-catalog.js
      # Wikipedia pageviews are kept between runs, keyed by month, so only the first deploy of a month fetches them
      - uses: actions/cache@v4
        with:
          path: .cache
          key: popularity-${{ github.run_id }}
          restore-keys: popularity-
      - name: Build the game catalog (libretro-database, popularity from Wikidata + Wikipedia)
        run: node tools/build-catalog.js --popularity
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
