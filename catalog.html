<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17110d" data-themed>
  <title>Game catalog</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="preload" href="fonts/jersey10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="catalog.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="screen cat">
    <header class="cat-head">
      <a class="btn" href="./">← Games</a>
      <h1>Game catalog</h1>
    </header>

    <nav id="systems" class="cat-systems" aria-label="Systems"></nav>

    <section class="cat-bar" aria-label="Filters">
      <input id="q" type="search" placeholder="Search titles, developers, publishers, serials" autocomplete="off" aria-label="Search">
      <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
      <select id="decade" aria-label="Decade"><option value="">Any year</option></select>
      <select id="players" aria-label="Players">
        <option value="">Any players</option><option value="2">2+ players</option><option value="3">3+ players</option><option value="4">4+ players</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="title">A–Z</option><option value="year">Oldest first</option><option value="-year">Newest first</option>
      </select>
      <label class="cat-check"><input id="extra" type="checkbox"> Prototypes, demos, homebrew, unlicensed</label>
    </section>

    <p id="summary" class="cat-summary" aria-live="polite"></p>
    <ul id="grid" class="cat-grid"></ul>
    <div id="more" class="cat-more"></div>

    <footer class="cat-foot">
      Game lists: <a href="https://no-intro.org">No-Intro</a> and <a href="http://redump.org">Redump</a>, with
      metadata from <a href="https://github.com/libretro/libretro-database">libretro-database</a> (CC BY-SA 4.0).
      Box art: <a href="https://github.com/libretro-thumbnails">libretro-thumbnails</a>.
      The catalog lists games; it doesn't contain or link to game files.
    </footer>
  </main>

  <dialog id="detail" class="cat-detail">
    <div class="cat-detail-top">
      <img id="d-art" alt="">
      <div>
        <p id="d-sys" class="hero-sys"></p>
        <h2 id="d-title"></h2>
        <dl id="d-facts" class="cat-facts"></dl>
      </div>
    </div>
    <h3>Releases</h3>
    <div class="cat-table-wrap">
      <table class="cat-table">
        <thead><tr><th>Release</th><th>Year</th><th>Serial</th><th>CRC32</th></tr></thead>
        <tbody id="d-releases"></tbody>
      </table>
    </div>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>

  <script src="catalog.js"></script>
</body>
</html>
