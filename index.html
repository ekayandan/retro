<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Retro</title>
  <meta name="description" content="Your retro games, with a friend — next to you or across the world. Nothing to install, no accounts, works offline.">
  <meta name="theme-color" content="#17110d" data-themed>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Retro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/jersey10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- HOME: a console-style home screen. One row of games (the shelf), a row of round system buttons
       (the dock) under it; arrows, a gamepad or a friend's phone move the selection. See app.js "Home". -->
  <main id="library" class="screen home">
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    <!-- The lit marquee. Blank until the product has its real name. -->
    <header class="marquee" aria-hidden="true"></header>
    <div class="topline">
      <span id="players" class="players" aria-label="Players connected"></span>
      <time id="clock" class="clock"></time>
    </div>

    <section class="hero" aria-live="polite">
      <p id="hero-sys" class="hero-sys"></p>
      <h1 id="hero-title" class="hero-title"></h1>
      <p id="hero-meta" class="hero-meta"></p>
      <ol id="steps" class="steps" hidden>
        <li><b>1</b> Insert a game: your own files or a .zip. They stay on this device.</li>
        <li><b>2</b> Call a friend over, next to you or across the world.</li>
        <li><b>3</b> Play. No accounts, nothing to install, works offline.</li>
      </ol>
    </section>

    <div id="shelf" class="shelf" role="list" aria-label="Games"></div>

    <nav class="dock" aria-label="System">
      <button id="insert-btn" class="dock-btn">
        <svg viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
          <rect x="4" y="1" width="2" height="8"/><rect x="1" y="4" width="8" height="2"/></svg>
        <span>Insert game</span></button>
      <button id="link-btn" class="dock-btn">
        <svg viewBox="0 -2 11 11" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor"><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="7" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="9" y="0" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="9" y="3" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg>
        <span>Play with a friend</span></button>
      <button id="settings-btn" class="dock-btn">
        <svg viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
          <rect x="1" y="2" width="8" height="1"/><rect x="2" y="1" width="2" height="3"/>
          <rect x="1" y="7" width="8" height="1"/><rect x="6" y="6" width="2" height="3"/></svg>
        <span>Settings</span></button>
      <input id="file" type="file" accept=".nes,.zip,.gb,.gbc,.gba,.sfc,.smc,.md,.gen,.smd,.sms,.gg,.pce,.z64,.n64,.v64,.nds,.chd,.iso,.cso,.pbp" multiple hidden>
    </nav>

    <footer class="hints">
      <span id="status" class="status" role="status"></span>
      <span class="keys keys-kb"><kbd>←</kbd><kbd>→</kbd> Choose <kbd>Enter</kbd> Play <kbd>O</kbd> Options</span>
      <span class="keys keys-pad"><kbd class="b-a">A</kbd> Play <kbd class="b-x">X</kbd> Options <kbd class="b-b">B</kbd> Back</span>
    </footer>
  </main>

  <!-- PLAYER -->
  <section id="player" class="screen" hidden>
    <div class="screen-wrap"><canvas id="screen" width="256" height="240"></canvas></div>
    <div id="pad" class="pad">
      <div class="dpad" data-dpad><span></span></div>
      <div class="mid">
        <button class="pill" data-b="2">SELECT</button>
        <button class="pill" data-b="3">START</button>
      </div>
      <div class="ab">
        <button class="round" data-b="1">B</button>
        <button class="round" data-b="0">A</button>
      </div>
    </div>
    <button id="menu-btn" class="menu-btn" aria-label="Menu">☰</button>
  </section>

  <!-- IN-GAME MENU -->
  <dialog id="menu">
    <h2 id="menu-title"></h2>
    <button data-act="resume" class="btn primary">Resume</button>
    <button data-act="link" class="btn">Play with a friend</button>
    <button data-act="save" class="btn">Save state</button>
    <button data-act="load" class="btn">Load state</button>
    <button data-act="reset" class="btn">Restart game</button>
    <button data-act="mute" class="btn">Sound: on</button>
    <button data-act="quit" class="btn">Back to the games</button>
  </dialog>

  <!-- SETTINGS -->
  <dialog id="settings" class="settings-dlg">
    <h2>Settings</h2>
    <fieldset class="themes">
      <legend>Colors</legend>
      <label class="theme"><input type="radio" name="theme" value="arcade">
        <span class="sw" data-theme="arcade"><i></i><i></i><i></i><i></i><i></i></span>
        <b>Arcade</b><small>Warm cabinet wood, red buttons, a lit marquee</small></label>
      <label class="theme"><input type="radio" name="theme" value="gameboy">
        <span class="sw" data-theme="gameboy"><i></i><i></i><i></i><i></i><i></i></span>
        <b>Game Boy</b><small>The four greens of the 1989 handheld</small></label>
      <label class="theme"><input type="radio" name="theme" value="nes">
        <span class="sw" data-theme="nes"><i></i><i></i><i></i><i></i><i></i></span>
        <b>NES</b><small>The console’s greys, black and red</small></label>
      <label class="theme"><input type="radio" name="theme" value="pico8">
        <span class="sw" data-theme="pico8"><i></i><i></i><i></i><i></i><i></i></span>
        <b>PICO-8</b><small>The fantasy console’s 16-color palette</small></label>
      <label class="theme"><input type="radio" name="theme" value="c64">
        <span class="sw" data-theme="c64"><i></i><i></i><i></i><i></i><i></i></span>
        <b>Commodore 64</b><small>BASIC’s blue screen and light-blue border</small></label>
      <label class="theme"><input type="radio" name="theme" value="zx">
        <span class="sw" data-theme="zx"><i></i><i></i><i></i><i></i><i></i></span>
        <b>ZX Spectrum</b><small>Bright primaries and the rainbow stripe</small></label>
      <label class="theme"><input type="radio" name="theme" value="cga">
        <span class="sw" data-theme="cga"><i></i><i></i><i></i><i></i><i></i></span>
        <b>CGA</b><small>Cyan, magenta and white, like early PC games</small></label>
      <label class="theme"><input type="radio" name="theme" value="dos">
        <span class="sw" data-theme="dos"><i></i><i></i><i></i><i></i><i></i></span>
        <b>DOS IDE</b><small>Yellow on blue, like Turbo Pascal</small></label>
      <label class="theme"><input type="radio" name="theme" value="phosphor">
        <span class="sw" data-theme="phosphor"><i></i><i></i><i></i><i></i><i></i></span>
        <b>Phosphor</b><small>A green-screen terminal</small></label>
      <label class="theme"><input type="radio" name="theme" value="amber">
        <span class="sw" data-theme="amber"><i></i><i></i><i></i><i></i><i></i></span>
        <b>Amber</b><small>An amber-screen terminal</small></label>
    </fieldset>
    <button data-act="close" class="btn">Done</button>
  </dialog>

  <!-- GAME OPTIONS -->
  <dialog id="opts">
    <h2 id="opts-title"></h2>
    <button data-act="art" class="btn">Find box art again</button>
    <button data-act="delete" class="btn danger">Delete game and saves</button>
    <button data-act="close" class="btn">Close</button>
  </dialog>

  <script src="lib/jsnes.min.js"></script>
  <script src="storage.js"></script>
  <script src="art.js"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="link.js"></script>
  <script src="app.js"></script>
</body>
</html>
